name: Hosted Runner Probe

# Probe only: confirms GitHub-hosted runners start for this public repo.
# Hosted runners ONLY. Never use a self-hosted runner in this public repo.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print runner info
        run: uname -a; date -u
